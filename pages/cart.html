<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lompas</title>

    <link rel="stylesheet" href="/css/styles.css" />

    <link rel="icon" type="image/png" href="/assets/images/Lompas-logo.png" />
  </head>
  <body>
    <header></header>
    <main></main>
    <footer class="site-footer">
      <div class="footer-container">
        <div class="footer-column footer-brand">
          <div class="logo-wrapper">
            <img
              src="/assets/images/Lompas-logo.png"
              alt="Logo de la empresa"
              class="footer-logo"
            />
            <span class="brand-name">Lompas</span>
          </div>
          <p class="brand-description">
            Creando soluciones digitales con un diseño cuidado y funcional.
          </p>
        </div>

        <div class="footer-column footer-socials">
          <h3>Síguenos</h3>
          <div class="social-links">
            <a
              href="https://www.linkedin.com"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
            >
              <i class="fab fa-linkedin"></i> LinkedIn
            </a>
            <a
              href="https://www.facebook.com"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Facebook"
            >
              <i class="fab fa-facebook"></i> Facebook
            </a>
            <a
              href="https://www.twitter.com"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Twitter"
            >
              <i class="fab fa-twitter"></i> Twitter
            </a>
          </div>
        </div>

        <div class="footer-column footer-contact">
          <h3>Contacto</h3>
          <ul>
            <li>
              <i class="fas fa-envelope"></i>
              <a href="mailto:info@misitio.com">lompas@gmail.com</a>
            </li>
            <li>
              <i class="fas fa-phone"></i>
              <a href="tel:+3413244971">3413244971</a>
            </li>
            <li><i class="fas fa-map-marker-alt"></i>San Luis 1220, S2000</li>
          </ul>
        </div>
      </div>

      <div class="footer-bottom">
        <p>&copy; 2026 MiSitio. Todos los derechos reservados.</p>
      </div>
    </footer>
  </body>
</html>
